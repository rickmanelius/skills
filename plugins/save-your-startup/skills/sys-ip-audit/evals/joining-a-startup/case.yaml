schema_version: "1.1"
name: joining-a-startup
expected_outcome: |
  A private ip-audit folder for Jordan Avery and Larderly with a ledger, a tailored Exhibit A, a chain-of-title brief
  and counsel questions. The ledger sorts the work into four buckets (the blog series and shelf-life library before
  the first hint; the pricecheck weekend project as independent work; the invoice import and reorder alert as
  contributions to Larderly; the freight client and the co-owned Tabletop widget as owned by others or held in
  confidence). Exhibit A dates every item, names no client, and lists the contributions with credit both ways. The
  brief's Part A asks first and Part C covers what happens if Jordan never starts. The self-audit flags the pasted
  client code and the first call recorded without consent. Nothing is presented as legal advice and nothing is spent.
